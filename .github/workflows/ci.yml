name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # Only aeon-jit is kept rustfmt-clean so far.
      - name: Format
        run: cargo fmt -p aeon-jit -- --check
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Includes the differential test (interpreter and JIT against Unicorn)
      # and the reduction goldens.
      - name: Test
        run: cargo test --workspace --locked
